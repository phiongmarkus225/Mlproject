[project]
name = "ml-project"
version = "0.1.0"
description = "Machine learning project"
authors = [{name = "Author", email = "author@example.com"}]
readme = "README.md"
requires-python = ">=3.8"

[project.dependencies]
numpy = "^1.21.0"
pandas = "^1.3.0"
scikit-learn = "^1.0.0"
matplotlib = "^3.4.0"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
