<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <h1>Student Performance Predictor</h1>
            <p class="subtitle">Predict a student's <strong>math score</strong> based on demographic and preparation features.</p>
        </header>

        <form action="/predictdata" method="post" class="predict-form">
            <div class="grid">
                <div class="field">
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="field">
                    <label for="race_ethnicity">Race / Ethnicity</label>
                    <select name="race_ethnicity" id="race_ethnicity" required>
                        <option value="group A">Group A</option>
                        <option value="group B" selected>Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="field">
                    <label for="parental_level_of_education">Parental Level of Education</label>
                    <select name="parental_level_of_education" id="parental_level_of_education" required>
                        <option value="some high school">Some High School</option>
                        <option value="high school">High School</option>
                        <option value="some college">Some College</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="master's degree">Master's Degree</option>
                    </select>
                </div>

                <div class="field">
                    <label for="lunch">Lunch Type</label>
                    <select name="lunch" id="lunch" required>
                        <option value="standard" selected>Standard</option>
                        <option value="free/reduced">Free / Reduced</option>
                    </select>
                </div>

                <div class="field">
                    <label for="test_preparation_course">Test Preparation Course</label>
                    <select name="test_preparation_course" id="test_preparation_course" required>
                        <option value="none" selected>None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="field">
                    <label for="reading_score">Reading Score (0 - 100)</label>
                    <input type="number" name="reading_score" id="reading_score"
                           min="0" max="100" step="1" value="70" required>
                </div>

                <div class="field">
                    <label for="writing_score">Writing Score (0 - 100)</label>
                    <input type="number" name="writing_score" id="writing_score"
                           min="0" max="100" step="1" value="70" required>
                </div>
            </div>

            <button type="submit" class="btn">Predict Math Score</button>
        </form>

        {% if results is not none %}
        <section class="result-card">
            <h2>Predicted Math Score</h2>
            <p class="result-value">{{ results }}</p>
            <p class="result-hint">Score range: 0 - 100</p>
        </section>
        {% endif %}

        <footer>
            <p>Model: trained with scikit-learn ensemble &amp; gradient boosting families.</p>
        </footer>
    </main>
</body>
</html>
